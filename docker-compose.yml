services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "AI Incident Investigator"
      APP_ENV: docker
      LOG_LEVEL: INFO
      API_V1_PREFIX: /api/v1
      DATABASE_URL: sqlite+aiosqlite:///./data/incident_investigator.db
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into the static bundle at build time. Points at the
        # backend's host-published port, since this is fetched from the
        # browser on the host, not from inside the Docker network.
        VITE_API_BASE_URL: http://localhost:8000/api/v1
    ports:
      - "5173:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
